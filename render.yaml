# Render Blueprint for the synthetic Streamlit testing host; see docs/STREAMLIT_TESTING.md.
services:
  - type: web
    name: spreadline-testing
    runtime: python
    plan: free
    branch: main
    # Deploy a main commit only after its GitHub Actions checks pass.
    autoDeployTrigger: checksPass
    # Run from repository root: the requirements file installs ./streamlit_app/component by that path.
    # The forced reinstall replaces any cached copy of the component with the committed bundle.
    buildCommand: >-
      pip install -r streamlit_app/requirements.txt &&
      pip install --no-deps --force-reinstall ./streamlit_app/component
    startCommand: >-
      streamlit run streamlit_app/app.py --server.port $PORT
      --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      # Rollout switch: entered as "false" at creation, enabled in the dashboard after verification.
      # Later Blueprint syncs leave it unchanged.
      - key: SPREADLINE_TESTING_ENABLED
        sync: false
      - key: SPREADLINE_OPERATOR_ID
        value: render-testing
      # Render generates both secrets; the token never leaves the server.
      - key: SPREADLINE_API_TOKEN
        generateValue: true
      - key: SPREADLINE_ACCESS_PASSWORD
        generateValue: true
