[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/app", "backend/tools", "gate/reference_calculator.py"]

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["backend/.venv", "frontend/node_modules", "frontend/dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "FURB"]
# String-initialized Decimal constructors are required for financial inputs.
ignore = ["FURB157"]
